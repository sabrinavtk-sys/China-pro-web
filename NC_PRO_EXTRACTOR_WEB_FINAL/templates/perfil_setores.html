{% extends "base_gestao.html" %}
{% block title %}Setores e Cargos — ChinaPRO{% endblock %}
{% block content %}
<header class="top"><div><span class="kicker">PERFIL</span><h1>Setores e cargos</h1><p class="muted">Organize sua participação em Lavagem, Ação e Gerência.</p></div></header>
<form method="post" class="card" style="max-width:760px">
  <h2>Participação</h2>
  <label><input style="width:auto" type="checkbox" name="setor_lavagem" {% if perfil.setor_lavagem %}checked{% endif %}> 💰 Setor de Lavagem</label>
  <label><input style="width:auto" type="checkbox" name="setor_acao" {% if perfil.setor_acao %}checked{% endif %}> 🔫 Setor de Ação</label>

  <div class="grid two">
    <div>
      <label>Cargo de Ação / Gerência</label>
      <select name="cargo_acao">
        <option value="">Selecione...</option>
        <optgroup label="Ação">
        {% for cargo in cargos_acao %}
        <option value="{{ cargo }}" {% if perfil.cargo_acao == cargo %}selected{% endif %}>{{ cargo }}</option>
        {% endfor %}
        </optgroup>
        <optgroup label="Gerência">
        {% for cargo in cargos_gerencia %}
        <option value="{{ cargo }}" {% if perfil.cargo_acao == cargo %}selected{% endif %}>{{ cargo }}</option>
        {% endfor %}
        </optgroup>
      </select>
    </div>
    <div>
      <label>Impulsos de Ação</label>
      <select name="impulsos_acao">
        {% for n in [0,1,2] %}<option value="{{ n }}" {% if perfil.impulsos_acao == n %}selected{% endif %}>{{ n }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <label>Impulsos de Lavagem</label>
  <select name="impulsos_lavagem">
    {% for n in [0,1,2] %}<option value="{{ n }}" {% if perfil.impulsos_lavagem == n %}selected{% endif %}>{{ n }}</option>{% endfor %}
  </select>

  <div class="actions"><button type="submit">Salvar perfil</button><a class="btn secondary" href="{{ url_for('gestao') }}">Voltar</a></div>
</form>
{% endblock %}
